# ===== Server =====
server.port=${PORT:8080}
spring.application.name=carcare

# Nginx orqasida ishlaganda haqiqiy IP ni olish (spam himoyasi IP bo'yicha ishlaydi)
server.forward-headers-strategy=native

# ===== Baza =====
# Lokal: H2 fayl bazasi (./data papkada saqlanadi, alohida o'rnatish shart emas)
# Serverda PostgreSQL uchun:
#   DB_URL=jdbc:postgresql://localhost:5432/carcare  DB_USER=postgres  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/carcare;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Bot (long polling) va eslatma bir-birini kutmasligi uchun
spring.task.scheduling.pool.size=4

# ===== Ilova =====
# Saytning tashqi manzili (Telegram xabarlaridagi havolalar uchun)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.zone=Asia/Tashkent
# Necha kun oldin eslatish
app.reminder-days-before=${REMINDER_DAYS:7}
# Har kuni soat 09:00 da tekshirish (sekund minut soat kun oy hafta_kuni)
app.reminder-cron=0 0 9 * * *

# ===== Super admin (birinchi ishga tushishda yaratiladi) =====
# Parol berilmasa, tasodifiy parol yaratilib konsolga chiqariladi
superadmin.username=${SUPERADMIN_USERNAME:superadmin}
superadmin.password=${SUPERADMIN_PASSWORD:}

# ===== Telegram bot =====
# @BotFather dan olingan token va bot username (masalan: CarCareUzBot)
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}

# ===== SMS (Eskiz.uz) — ixtiyoriy, pullik. Standart holatda O'CHIQ =====
# O'chiq bo'lsa barcha eslatmalar faqat Telegram bot orqali (bepul) boradi.
sms.enabled=${SMS_ENABLED:false}
sms.eskiz-email=${ESKIZ_EMAIL:}
sms.eskiz-password=${ESKIZ_PASSWORD:}
sms.from=${ESKIZ_FROM:4546}

# ---------- Demo ma'lumotlar ----------
# true bo'lsa va bazada hali servis bo'lmasa, panel demo sahifadagidek to'ldiriladi
# (Avto Lider servisi, xodimlar: sardor / dilnoza / akmal, mijozlar, qarzlar, sadoqat kartalari).
# Haqiqiy ishga topshirishda yoqmang.
app.demo-data=${DEMO_DATA:false}
app.demo-password=${DEMO_PASSWORD:demo12345}
